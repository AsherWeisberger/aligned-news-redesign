<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F0EFEC" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Aligned News" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=an162" />
<link rel="manifest" href="manifest.json?v=an162" />
<title>Sign up / Login · Aligned News</title>
<meta name="description" content="Sign up or log in to Aligned News — Pro reader desk mock." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D0F14'/%3E%3Cpath d='M18 42 L32 14 L46 42 Z' fill='none' stroke='%23fff' stroke-width='4.5' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='46' r='3.2' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=an197" />
</head>
<body data-page="auth" class="auth-body">
  <div class="load-bar" id="loadBar" hidden aria-hidden="true"><div class="load-bar-inner"></div></div>

<div class="app">
    <header class="topbar">
      <button class="menu-btn" id="menuToggle" type="button" aria-label="Open menu" data-i18n-aria="open_menu" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand brand-align" href="index.html" aria-label="Aligned News">
        <span class="brand-align-mark" aria-hidden="true">
          <span class="brand-align-half brand-align-top">Aligned</span>
          <span class="brand-align-half brand-align-bot">Aligned</span>
        </span>
        <span class="brand-align-sub full"><em>News</em></span>
      </a>
      <p class="brand-tagline" title="Product promise">AI signal from 63 curated X lists</p>
      <div class="top-actions">
        <button type="button" class="gm-widget" id="godModeWidget" aria-label="Open God Mode" title="God Mode">
          <span class="gm-widget-atm" aria-hidden="true"></span>
          <canvas class="gm-widget-globe" width="72" height="72" aria-hidden="true"></canvas>
          <span class="gm-widget-pulse" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="Primary"></aside>

    <main class="main">
      <div class="page auth-page page-enter">
        <div class="auth-card" id="authCard">
          <p class="auth-card-kicker">Aligned News</p>
          <h1 class="auth-card-title" id="authTitle">Create your desk</h1>
          <p class="auth-card-sub" id="authSub">Join the Aligned News Pro desk mock. Backend wiring comes later.</p>

          <div class="auth-tabs" role="tablist" aria-label="Auth mode">
            <button type="button" class="auth-tab is-active" id="tabSignup" role="tab" aria-selected="true" data-mode="signup">Sign up</button>
            <button type="button" class="auth-tab" id="tabLogin" role="tab" aria-selected="false" data-mode="login" data-i18n="log_in">Log in</button>
          </div>

          <form class="auth-form" id="authForm" data-mode="signup" novalidate>
            <div class="auth-field auth-field-optional" id="nameField">
              <label for="authName"><span data-i18n="name">Name</span> <span style="font-weight:500;color:var(--muted)" data-i18n="optional">(optional)</span></label>
              <input id="authName" name="name" type="text" autocomplete="name" placeholder="Asher" />
            </div>
            <div class="auth-field">
              <label for="authEmail" data-i18n="email">Email</label>
              <input id="authEmail" name="email" type="email" autocomplete="email" required placeholder="you@company.com" />
            </div>
            <div class="auth-field">
              <label for="authPassword" data-i18n="password">Password</label>
              <input id="authPassword" name="password" type="password" autocomplete="new-password" required placeholder="••••••••" minlength="6" />
            </div>
            <div class="auth-field auth-field-optional" id="confirmField">
              <label for="authConfirm" data-i18n="confirm_password">Confirm password</label>
              <input id="authConfirm" name="confirm" type="password" autocomplete="new-password" placeholder="••••••••" minlength="6" />
            </div>
            <button type="submit" class="auth-submit" id="authSubmit">Create account</button>
          </form>

          <div class="auth-divider" aria-hidden="true" data-i18n="or">or</div>
          <button type="button" class="auth-google" id="authGoogle" disabled title="Coming soon" data-i18n="continue_google" data-i18n-title="coming_soon">Continue with Google</button>
          <p class="auth-google-note" data-i18n="google_note">Google sign-in is mocked for now.</p>
          <p class="auth-demo-note" data-i18n="demo_note">Demo UI — auth wiring coming soon</p>
        </div>
      </div>
    </main>
  </div>
  <div class="auth-toast" id="authToast" role="status" aria-live="polite" hidden data-i18n="auth_toast">You’re in — backend not wired yet</div>
  <script src="i18n.js?v=an200"></script>
  <script src="an-saved.js?v=an162"></script>
  <script src="app.js?v=an200"></script>
  <script>
  (function () {
    var form = document.getElementById("authForm");
    var tabSignup = document.getElementById("tabSignup");
    var tabLogin = document.getElementById("tabLogin");
    var title = document.getElementById("authTitle");
    var sub = document.getElementById("authSub");
    var submit = document.getElementById("authSubmit");
    var toast = document.getElementById("authToast");
    var confirmInput = document.getElementById("authConfirm");
    var passwordInput = document.getElementById("authPassword");
    var toastTimer = null;

    function setMode(mode) {
      var signup = mode === "signup";
      form.setAttribute("data-mode", signup ? "signup" : "login");
      tabSignup.classList.toggle("is-active", signup);
      tabLogin.classList.toggle("is-active", !signup);
      tabSignup.setAttribute("aria-selected", signup ? "true" : "false");
      tabLogin.setAttribute("aria-selected", signup ? "false" : "true");
      function tt(k) { return (window.anT && window.anT(k)) || k; }
      title.textContent = signup ? tt("create_desk") : tt("welcome_back");
      sub.textContent = signup ? tt("auth_sub_signup") : tt("auth_sub_login");
      submit.textContent = signup ? tt("create_account") : tt("log_in");
      tabSignup.textContent = tt("sign_up");
      tabLogin.textContent = tt("log_in");
      passwordInput.autocomplete = signup ? "new-password" : "current-password";
      if (confirmInput) {
        confirmInput.required = signup;
        if (!signup) confirmInput.value = "";
      }
    }

    function showToast(msg) {
      if (!toast) return;
      toast.textContent = msg || ((window.anT && window.anT("auth_toast")) || "You’re in — backend not wired yet");
      toast.hidden = false;
      toast.classList.add("is-on");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove("is-on");
        setTimeout(function () { toast.hidden = true; }, 220);
      }, 3200);
    }

    tabSignup.addEventListener("click", function () { setMode("signup"); });
    tabLogin.addEventListener("click", function () { setMode("login"); });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var mode = form.getAttribute("data-mode") || "signup";
      var email = (document.getElementById("authEmail").value || "").trim();
      var password = passwordInput.value || "";
      if (!email || !password) {
        showToast((window.anT && window.anT("auth_need")) || "Add an email and password to continue");
        return;
      }
      if (mode === "signup") {
        var confirm = confirmInput ? confirmInput.value : "";
        if (confirm && confirm !== password) {
          showToast((window.anT && window.anT("auth_mismatch")) || "Passwords don’t match — try again");
          return;
        }
      }
      showToast((window.anT && window.anT("auth_toast")) || "You’re in — backend not wired yet");
    });

    setMode("signup");
    document.addEventListener("an-lang", function () {
      setMode(form.getAttribute("data-mode") || "signup");
    });
  })();
  </script>
</body>
</html>
